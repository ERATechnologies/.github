    <circle cx="75" cy="336" r="5" fill="#7C3AED"/>
    <circle cx="1010" cy="136" r="5" fill="#7C3AED"/>
  </g>

  <g opacity="0.7" stroke="#A8B9D6" stroke-width="2" fill="none">
    <path d="M1450 328L1550 328"/>
    <path d="M1450 360L1552 360"/>
